<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Peek-a-Boo Haunted House</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    background: #0c1a2e;
    overscroll-behavior: none;
    font-family: -apple-system, "Comic Sans MS", "Marker Felt", sans-serif;
  }
  #game {
    position: fixed;
    left: 0; top: 0;
    width: 100vw; height: 100vh;
    display: block;
  }
  /* TAP TO PLAY overlay */
  #startOverlay {
    position: fixed;
    left: 0; top: 0; right: 0; bottom: 0;
    width: 100vw; height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: radial-gradient(circle at 50% 30%, #2a3d66 0%, #0c1a2e 100%);
    z-index: 999;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    text-align: center;
    color: #fff;
    transition: opacity .4s ease;
  }
  #startOverlay.hidden { opacity: 0; pointer-events: none; }
  #startOverlay h1 {
    font-size: clamp(28px, 8vw, 56px);
    margin: 0 0 6px 0;
    letter-spacing: 1px;
    text-shadow: 0 4px 0 #7b3fbf, 0 6px 18px rgba(0,0,0,.6);
  }
  #startOverlay .ghost-emoji { font-size: clamp(52px, 15vw, 96px); margin: 10px 0; animation: bob 1.6s ease-in-out infinite; }
  #startOverlay .tapBtn {
    margin-top: 20px;
    font-size: clamp(26px, 8vw, 48px);
    font-weight: bold;
    color: #ffd94a;
    text-shadow: 0 3px 0 #7b3fbf;
    background: rgba(255,255,255,.12);
    border: 4px solid #ffd94a;
    border-radius: 60px;
    padding: 14px 34px;
    animation: pulse 1.4s ease-in-out infinite;
    pointer-events: none;
  }
  #startOverlay .hint {
    margin-top: 24px;
    font-size: clamp(14px, 4vw, 22px);
    color: #cfd8ff;
    max-width: 90vw;
    line-height: 1.5;
  }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

  /* navigation arrow buttons (big preschool touch targets) */
  .navBtn {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 22px);
    width: clamp(88px, 20vw, 150px);
    height: clamp(88px, 20vw, 150px);
    border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, #7b6bb8, #4a3a8f);
    border: 5px solid #ffd94a;
    box-shadow: 0 6px 0 #2a1a6e, 0 10px 22px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(40px, 10vw, 64px);
    color: #fff;
    text-shadow: 0 3px 0 #2a1a6e;
    z-index: 60;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease;
  }
  .navBtn.pressed { transform: scale(0.9); }
  #leftBtn { left: calc(env(safe-area-inset-left) + 16px); }
  #rightBtn { right: calc(env(safe-area-inset-right) + 16px); }
  .navBtn .arrow { pointer-events: none; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="startOverlay">
  <div class="ghost-emoji">👻</div>
  <h1>Peek-a-Boo Haunted House</h1>
  <div class="tapBtn">TAP TO PLAY!</div>
  <div class="hint">Tap the friends hiding in the windows and doors to earn stars. Fill the lamp at the top to light up the whole house! Use the arrow buttons to walk to other rooms.</div>
</div>

<button id="leftBtn" class="navBtn" aria-label="go left"><span class="arrow">◀</span></button>
<button id="rightBtn" class="navBtn" aria-label="go right"><span class="arrow">▶</span></button>

<script>
"use strict";

(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startOverlay = document.getElementById('startOverlay');
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');

  let W = 0, H = 0, dpr = 1;
  let audioCtx = null, audioReady = false;
  let bgMusicTimer = null;

  /* ---------- resize / fit ---------- */
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildRoom();
  }

  /* ---------- game state ---------- */
  const characters = []; // active peeking characters
  const stars = [];      // floating star particles
  const sparks = [];     // little sparkle bursts
  const confetti = [];   // celebration confetti

  let currentRoom = 0;
  let roomSpots = [];    // pixel positions for current room
  let starCount = 0;
  let starGoal = 10;
  let houseLit = false;
  let litTimer = 0;
  let celebrate = 0;
  let spawnTimer = 0;
  let time = 0;

  // room switching fade: 0=none, 1=fading to dark, 2=fading in new room
  let fadeState = 0, fadeT = 0, targetRoom = 0;

  const rng = (() => {
    let s = 42;
    return () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  })();

  /* ---------- audio (iOS safe) ---------- */
  function ensureAudio() {
    if (audioCtx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      audioCtx.resume && audioCtx.resume();
      audioReady = true;
    } catch (e) { audioReady = false; }
  }

  function note(freq, t, dur, type, vol) {
    const c = audioCtx;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    o.start(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.85);
    o.stop(t + dur);
    o.connect(g); g.connect(c.destination);
  }

  function synthGiggle() {
    if (!audioCtx) return;
    const c = audioCtx, t = c.currentTime;
    [880, 990, 660, 740].forEach(function (f, i) {
      note(f, t + i * 0.14, 0.16, 'triangle', 0.25);
    });
  }

  function synthPop() {
    if (!audioCtx) return;
    const c = audioCtx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(420, t + 0.09);
    o.start(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.stop(t + 0.16);
    o.connect(g); g.connect(c.destination);
  }

  function synthWhoosh() {
    if (!audioCtx) return;
    const c = audioCtx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(520, t + 0.18);
    o.start(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.stop(t + 0.22);
    o.connect(g); g.connect(c.destination);
  }

  function synthFanfare() {
    if (!audioCtx) return;
    const c = audioCtx, t = c.currentTime;
    [523, 659, 784, 1046, 784, 1046].forEach(function (f, i) {
      note(f, t + i * 0.11, 0.12, 'triangle', 0.22);
    });
  }

  function synthTune() {
    if (!audioCtx) return;
    const c = audioCtx, t = c.currentTime;
    [523, 659, 784, 659, 523, 587, 659, 523].forEach(function (f, i) {
      note(f, t + i * 0.5, 0.5, 'sine', 0.06);
    });
  }

  function startMusic() {
    if (!audioCtx || bgMusicTimer) return;
    synthTune();
    bgMusicTimer = setInterval(function () { if (audioCtx) synthTune(); }, 4000);
  }

  /* ---------- drawing helpers ---------- */
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function starShape(x, y, s, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = color || '#ffd94a';
    ctx.beginPath(); ctx.arc(0, 0, s * 1.5, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? s : s * 0.42;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = color || '#ffd94a';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save();
    ctx.scale(0.5, 0.5);
    ctx.fillStyle = '#fff8d8'; ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  function shadow(x, y, s) {
    ctx.fillStyle = 'rgba(0,0,20,0.28)';
    ctx.beginPath(); ctx.ellipse(x, y + 6, 30 * s, 8 * s, 0, 0, 7); ctx.fill();
  }

  /* ---------- characters (procedural) ---------- */
  function drawGhost(x, y, s, t, bounce) {
    const bob = Math.sin(t * 3) * 4 * s;
    const squash = bounce ? 1 + Math.sin(bounce * 12) * 0.18 : 1;
    ctx.save();
    ctx.translate(x, y + bob - (bounce ? Math.sin(bounce * 12) * 14 * s : 0));
    ctx.scale(s * (1 / squash), s * squash);
    shadow(0, 2, 1);
    ctx.beginPath();
    ctx.moveTo(0, -84);
    ctx.quadraticCurveTo(26, -56, 26, 0);
    for (let i = 0; i < 5; i++) ctx.quadraticCurveTo(26, 26 + i * 13, 16 + (i % 2 ? 8 : -8), 24 + i * 13);
    ctx.quadraticCurveTo(-26, 96, -26, 0);
    ctx.quadraticCurveTo(-26, -56, 0, -84);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = '#b8c4ff'; ctx.lineWidth = 3.5; ctx.stroke();
    ctx.fillStyle = '#ffd9e6';
    ctx.beginPath(); ctx.arc(-14, -26, 6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(14, -26, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a4fae';
    ctx.beginPath(); ctx.arc(-10, -44, 8, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -44, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-12, -46, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -46, 3, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3a4fae'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(0, -16, 10, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.restore();
  }

  function drawZombie(x, y, s, t, bounce) {
    const sway = Math.sin(t * 2.2) * 3 * s;
    const squash = bounce ? 1 + Math.sin(bounce * 10) * 0.16 : 1;
    ctx.save();
    ctx.translate(x + sway, y - (bounce ? Math.sin(bounce * 10) * 14 * s : 0));
    ctx.scale(s * (1 / squash), s * squash);
    shadow(0, 2, 1);
    roundRect(-26, -62, 52, 62, 16);
    ctx.fillStyle = '#8fd47a'; ctx.fill();
    ctx.strokeStyle = '#4f8f3a'; ctx.lineWidth = 3.5; ctx.stroke();
    roundRect(-14, -20, 16, 14, 4); ctx.fillStyle = '#6fb85a'; ctx.fill();
    ctx.strokeStyle = '#3f7a2f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-13,-19); ctx.lineTo(-9,-17); ctx.moveTo(-9,-17); ctx.lineTo(-5,-19); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -82, 28, 0, 7); ctx.fillStyle = '#9be08a'; ctx.fill(); ctx.strokeStyle = '#4f8f3a'; ctx.lineWidth = 3.5; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-10, -86, 10, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -86, 10, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a4a1a';
    ctx.beginPath(); ctx.arc(-10, -86, 6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -86, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-12, -88, 2.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -88, 2.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#d4ffd0';
    ctx.beginPath(); ctx.arc(-15, -66, 5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(15, -66, 5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#2e5a2e'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-8, -60); ctx.lineTo(2, -66); ctx.lineTo(10, -62); ctx.stroke();
    ctx.fillStyle = '#4f8f3a';
    ctx.beginPath(); ctx.arc(0, -106, 10, Math.PI, 0); ctx.fill();
    ctx.restore();
  }

  function drawMonster(x, y, s, t, bounce) {
    const wig = Math.sin(t * 2.6) * 3 * s;
    const squash = bounce ? 1 + Math.sin(bounce * 11) * 0.16 : 1;
    ctx.save();
    ctx.translate(x + wig, y - (bounce ? Math.sin(bounce * 11) * 14 * s : 0));
    ctx.scale(s * (1 / squash), s * squash);
    shadow(0, 2, 1);
    roundRect(-28, -58, 56, 58, 18);
    ctx.fillStyle = '#c77bff'; ctx.fill();
    ctx.strokeStyle = '#9b4fd6'; ctx.lineWidth = 3.5; ctx.stroke();
    ctx.fillStyle = '#e0b8ff';
    ctx.beginPath(); ctx.arc(-8, -30, 6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -40, 5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -84, 26, 0, 7); ctx.fillStyle = '#c77bff'; ctx.fill(); ctx.strokeStyle = '#9b4fd6'; ctx.lineWidth = 3.5; ctx.stroke();
    ctx.fillStyle = '#9b4fd6';
    ctx.beginPath(); ctx.moveTo(-15, -104); ctx.lineTo(-11, -118); ctx.lineTo(-4, -106); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4, -106); ctx.lineTo(11, -118); ctx.lineTo(15, -104); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-10, -86, 11, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -86, 11, 0, 7); ctx.fill();
    ctx.fillStyle = '#4a1a8a';
    ctx.beginPath(); ctx.arc(-10, -86, 6.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -86, 6.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-12, -88, 2.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -88, 2.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8d0ff';
    ctx.beginPath(); ctx.arc(-16, -66, 5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(16, -66, 5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3a1466'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(0, -60, 12, 0.1, Math.PI - 0.1); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-7, -55); ctx.lineTo(-3.5, -50); ctx.lineTo(0, -55); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -55); ctx.lineTo(3.5, -50); ctx.lineTo(7, -55); ctx.fill();
    ctx.restore();
  }

  /* ---------- rooms ---------- */
  // spots: x/yTop/h as fractions of W/H. isDoor true = a door, false = a window.
  const ROOMS = [
    { emoji: '🛋️', wall1: '#5a3a8f', wall2: '#6b4a9f', trim: '#3a2a6e',
      spots: [
        { x: 0.20, yTop: 0.18, h: 0.30, isDoor: false },
        { x: 0.80, yTop: 0.18, h: 0.30, isDoor: false },
        { x: 0.50, yTop: 0.52, h: 0.38, isDoor: true }
      ] },
    { emoji: '🍳', wall1: '#5a7a3a', wall2: '#6b8a4a', trim: '#3a4a22',
      spots: [
        { x: 0.50, yTop: 0.18, h: 0.28, isDoor: false },
        { x: 0.25, yTop: 0.50, h: 0.34, isDoor: true },
        { x: 0.75, yTop: 0.50, h: 0.34, isDoor: true }
      ] },
    { emoji: '🛏️', wall1: '#3a5a8f', wall2: '#4a6b9f', trim: '#263a66',
      spots: [
        { x: 0.50, yTop: 0.20, h: 0.28, isDoor: false },
        { x: 0.20, yTop: 0.50, h: 0.32, isDoor: true },
        { x: 0.80, yTop: 0.50, h: 0.32, isDoor: true }
      ] },
    { emoji: '🏚️', wall1: '#8a5a2a', wall2: '#9a6a3a', trim: '#5a3a1a',
      spots: [
        { x: 0.50, yTop: 0.22, h: 0.26, isDoor: false },  // round window
        { x: 0.30, yTop: 0.55, h: 0.30, isDoor: true },   // trunk
        { x: 0.70, yTop: 0.55, h: 0.30, isDoor: true }
      ] },
    { emoji: '🕳️', wall1: '#2a4a5a', wall2: '#3a5a6a', trim: '#1a3038',
      spots: [
        { x: 0.22, yTop: 0.22, h: 0.24, isDoor: false },
        { x: 0.78, yTop: 0.22, h: 0.24, isDoor: false },
        { x: 0.50, yTop: 0.50, h: 0.40, isDoor: true }    // stone arch door
      ] }
  ];

  function buildRoom() {
    roomSpots = [];
    const r = ROOMS[currentRoom];
    r.spots.forEach(function (sp) {
      const w = Math.min(W * 0.26, 120);
      const h = H * sp.h;
      const x = W * sp.x;
      const yTop = H * sp.yTop;
      roomSpots.push({ x: x, yTop: yTop, w: w, h: h, isDoor: sp.isDoor, occupied: false });
    });
    // clear characters from the old room when moving
    characters.forEach(function (c) { c.dead = true; });
    for (let i = 0; i < roomSpots.length; i++) roomSpots[i].occupied = false;
  }

  /* ---------- room environment ---------- */
  function drawRoom() {
    const r = ROOMS[currentRoom];

    // wall gradient
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.78);
    g.addColorStop(0, r.wall1);
    g.addColorStop(1, r.wall2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H * 0.78);

    // floor
    const f = ctx.createLinearGradient(0, H * 0.78, 0, H);
    f.addColorStop(0, '#4a3624');
    f.addColorStop(1, '#332417');
    ctx.fillStyle = f;
    ctx.fillRect(0, H * 0.78, W, H * 0.22);

    // baseboard
    ctx.fillStyle = r.trim;
    ctx.fillRect(0, H * 0.77, W, H * 0.03);

    drawFurniture(r);

    // windows + doors
    const litGlow = houseLit ? 1 : 0;
    roomSpots.forEach(function (sp) {
      const w = sp.w, h = sp.h;
      const x = sp.x - w / 2, y = sp.yTop;
      if (sp.isDoor) {
        roundRect(x, y, w, h, 8);
        ctx.fillStyle = '#5a3a2a'; ctx.fill();
        ctx.strokeStyle = '#3a2418'; ctx.lineWidth = 5; ctx.stroke();
        // door handle
        ctx.fillStyle = '#ffd94a';
        ctx.beginPath(); ctx.arc(sp.x + w * 0.22, y + h * 0.55, 5, 0, 7); ctx.fill();
        // warm light from door crack
        ctx.fillStyle = '#ffe9a8';
        ctx.globalAlpha = 0.25 + 0.1 * Math.sin(time * 3);
        ctx.beginPath(); ctx.arc(sp.x, y + h * 0.18, 6, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        roundRect(x, y, w, h, 12);
        const glow = ctx.createLinearGradient(0, y, 0, y + h);
        glow.addColorStop(0, litGlow ? '#fff3c0' : '#ffdf9e');
        glow.addColorStop(1, litGlow ? '#ffe9b0' : '#ffb86b');
        ctx.fillStyle = glow; ctx.fill();
        ctx.strokeStyle = '#1c3058'; ctx.lineWidth = 5; ctx.stroke();
        // window frame cross
        ctx.strokeStyle = '#1c3058'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(sp.x, y + 6); ctx.lineTo(sp.x, y + h - 6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 6, sp.yTop + h * 0.5); ctx.lineTo(x + w - 6, sp.yTop + h * 0.5); ctx.stroke();
      }
      if (!sp.isDoor) {
        // flower box
        ctx.fillStyle = '#ffb02e';
        roundRect(x - 4, y + h - 8, w + 8, 12, 4); ctx.fill();
        for (let f2 = 0; f2 < 4; f2++) {
          ctx.fillStyle = ['#ff6b8a', '#ffd94a', '#ff8ab8', '#b8ff6b'][f2];
          ctx.beginPath(); ctx.arc(x + 8 + f2 * (w - 16) / 3, y + h - 4, 6, 0, 7); ctx.fill();
        }
      }
    });

    // soft vignette
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.62);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(10,12,30,0.4)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  function drawFurniture(r) {
    const id = ROOMS.indexOf(r);
    // room emoji badge (visual room indicator, no reading)
    ctx.font = (H * 0.07) + 'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(r.emoji, 18, 18 + H * 0.05);

    if (id === 0) { // living room: fireplace + rug
      const fx = W * 0.5, fy = H * 0.80;
      roundRect(fx - 34, fy - 90, 68, 90, 10); ctx.fillStyle = '#7a5a8f'; ctx.fill(); ctx.strokeStyle = '#4a2a6e'; ctx.lineWidth = 4; ctx.stroke();
      roundRect(fx - 24, fy - 40, 48, 40, 6); ctx.fillStyle = '#3a2a4a'; ctx.fill();
      // fire
      for (let i = 0; i < 6; i++) {
        const fl = Math.sin(time * 6 + i) * 5;
        ctx.fillStyle = i % 2 ? '#ff8a3a' : '#ffd94a';
        ctx.beginPath(); ctx.arc(fx - 18 + i * 6 + fl, fy - 44 - i * 3, 6, 0, 7); ctx.fill();
      }
      ctx.fillStyle = '#ffd94a'; ctx.globalAlpha = 0.18 + 0.1 * Math.sin(time * 7);
      ctx.beginPath(); ctx.arc(fx, fy - 50, 26, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      // rug
      ctx.fillStyle = '#b05a6e';
      roundRect(fx - 90, fy + 6, 180, 26, 14); ctx.fill();
      ctx.fillStyle = '#e88aa0'; ctx.globalAlpha = 0.6;
      roundRect(fx - 80, fy + 11, 160, 16, 12); ctx.fill(); ctx.globalAlpha = 1;
    }
    else if (id === 1) { // kitchen: stove + table
      const sx = W * 0.5, sy = H * 0.80;
      roundRect(sx - 40, sy - 70, 80, 70, 8); ctx.fillStyle = '#8a8a7a'; ctx.fill(); ctx.strokeStyle = '#5a5a4a'; ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = '#3a3a2a';
      roundRect(sx - 34, sy - 58, 68, 6, 2); ctx.fill();
      ctx.fillStyle = '#ffd94a';
      ctx.beginPath(); ctx.arc(sx - 24, sy - 50, 4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(sx + 24, sy - 50, 4, 0, 7); ctx.fill();
      // pot
      roundRect(sx - 16, sy - 34, 32, 22, 4); ctx.fillStyle = '#3a3a4a'; ctx.fill();
      ctx.fillStyle = '#4a4a5a';
      roundRect(sx - 20, sy - 38, 40, 8, 3); ctx.fill();
      // table
      roundRect(sx - 60, sy + 8, 120, 14, 6); ctx.fillStyle = '#7a5a3a'; ctx.fill();
      ctx.fillStyle = '#6a4a2a';
      ctx.fillRect(sx - 56, sy + 22, 8, 14);
      ctx.fillRect(sx + 48, sy + 22, 8, 14);
    }
    else if (id === 2) { // bedroom: bed + lamp
      const bx = W * 0.5, by = H * 0.80;
      roundRect(bx - 80, by - 34, 160, 34, 8); ctx.fillStyle = '#6b8ab8'; ctx.fill(); ctx.strokeStyle = '#4a6a9f'; ctx.lineWidth = 4; ctx.stroke();
      roundRect(bx - 74, by - 46, 148, 16, 8); ctx.fillStyle = '#9ab8e8'; ctx.fill();
      ctx.fillStyle = '#e8f0ff'; ctx.globalAlpha = 0.7;
      roundRect(bx - 30, by - 52, 60, 22, 10); ctx.fill(); ctx.globalAlpha = 1;
      // night lamp
      roundRect(bx + 70, by - 60, 10, 44, 4); ctx.fillStyle = '#3a2a4a'; ctx.fill();
      ctx.fillStyle = '#ffd94a'; ctx.globalAlpha = 0.5 + 0.3 * Math.sin(time * 5);
      ctx.beginPath(); ctx.arc(bx + 75, by - 64, 9, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      // rug
      ctx.fillStyle = '#4a7a9f';
      roundRect(bx - 60, by + 8, 120, 16, 10); ctx.fill();
    }
    else if (id === 3) { // attic: boxes + hanging lamp
      const ax = W * 0.5, ay = H * 0.82;
      roundRect(ax - 70, ay - 26, 56, 26, 4); ctx.fillStyle = '#8a6a4a'; ctx.fill(); ctx.strokeStyle = '#5a3a2a'; ctx.lineWidth = 3; ctx.stroke();
      roundRect(ax + 10, ay - 20, 60, 20, 4); ctx.fillStyle = '#9a7a5a'; ctx.fill(); ctx.strokeStyle = '#5a3a2a'; ctx.lineWidth = 3; ctx.stroke();
      // hanging lamp
      ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(W * 0.5, H * 0.06); ctx.lineTo(W * 0.5, H * 0.20); ctx.stroke();
      ctx.fillStyle = '#ffd94a'; ctx.globalAlpha = 0.4 + 0.2 * Math.sin(time * 4);
      ctx.beginPath(); ctx.arc(W * 0.5, H * 0.22, 14, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    }
    else { // basement: shelves + barrels
      const sx = W * 0.18, sy = H * 0.82;
      roundRect(sx - 40, sy - 70, 80, 70, 4); ctx.fillStyle = '#4a3a2a'; ctx.fill(); ctx.strokeStyle = '#2a1a12'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#3a2a1a';
      ctx.fillRect(sx - 40, sy - 44, 80, 5);
      ctx.fillRect(sx - 40, sy - 20, 80, 5);
      ctx.fillStyle = '#7a6a5a';
      ctx.beginPath(); ctx.arc(sx - 30, sy - 54, 10, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(sx + 30, sy - 30, 10, 0, 7); ctx.fill();
      // barrel
      const bx = W * 0.82, by = H * 0.84;
      roundRect(bx - 16, by - 36, 32, 36, 6); ctx.fillStyle = '#6a4a2a'; ctx.fill(); ctx.strokeStyle = '#3a2a12'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#3a2a12';
      ctx.beginPath(); ctx.moveTo(bx - 16, by - 22); ctx.lineTo(bx + 16, by - 22); ctx.stroke();
    }
  }

  /* ---------- spawn logic ---------- */
  function spawnCharacter() {
    const free = roomSpots.filter(function (s) { return !s.occupied; });
    if (!free.length) return;
    const sp = free[Math.floor(rng() * free.length)];
    const kind = Math.floor(rng() * 3); // 0 ghost, 1 zombie, 2 monster
    const scale = 0.85 + rng() * 0.35;
    characters.push({
      spot: sp,
      kind: kind,
      x: sp.x,
      y: sp.yTop,
      scale: scale,
      t: rng() * 100,
      life: 2.5 + rng() * 1.5,
      dur: 0,
      bounce: 0,
      tapped: false,
      appear: 0,
      cue: 0,
      active: true
    });
    sp.occupied = true;
    synthPop();
  }

  /* ---------- input (multi-touch friendly) ---------- */
  function onDown(x, y) {
    if (startOverlay && !startOverlay.classList.contains('hidden')) {
      startOverlay.classList.add('hidden');
      ensureAudio();
      startMusic();
      return;
    }
    ensureAudio();
    if (!audioReady) startMusic();
    // check characters from topmost (last drawn) first
    for (let i = characters.length - 1; i >= 0; i--) {
      const c = characters[i];
      if (!c.active || !c.tapped) {
        const cx = c.x, cy = c.y - 40 * c.scale;
        const half = 46 * c.scale;
        if (x >= cx - half && x <= cx + half && y >= cy - half && y <= cy + half) {
          tapCharacter(c);
          return;
        }
      }
    }
    // tapped empty space: a little sparkle so the screen always responds (no frustration)
    for (let i = 0; i < 3; i++) {
      sparks.push({ x: x + (rng() - 0.5) * 24, y: y + (rng() - 0.5) * 24, vx: 0, vy: -0.5, life: 0 });
    }
  }

  function tapCharacter(c) {
    c.tapped = true;
    c.bounce = 0.0001;
    synthGiggle();
    starCount++;
    const isMilestone = starCount % 5 === 0;
    const isFull = starCount >= starGoal;
    stars.push({ x: c.x, y: c.y - 60 * c.scale, vx: (rng() - 0.5) * 30, vy: -1.6, life: 0, scale: 1.5 + rng(), color: (isMilestone || isFull) ? '#ff8ae0' : '#ffd94a' });
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      sparks.push({ x: c.x, y: c.y - 40 * c.scale, vx: Math.cos(a) * 2.4, vy: Math.sin(a) * 2.4 - 1, life: 0 });
    }
    if (isMilestone) {
      celebrate = 1;
      synthFanfare();
      burst(c.x, c.y - 40 * c.scale, 26);
    }
    if (isFull && !houseLit) {
      houseLit = true;
      litTimer = 0;
      synthFanfare();
      celebrate = 1;
      burst(W / 2, H * 0.3, 40);
    }
  }

  function burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = rng() * Math.PI * 2;
      const sp = 2 + rng() * 3.5;
      confetti.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
        life: 0, rot: rng() * 6,
        color: ['#ff8ae0', '#ffd94a', '#8ae0ff', '#8affa0', '#c9a0ff'][Math.floor(rng() * 5)]
      });
    }
  }

  /* ---------- room navigation ---------- */
  function switchRoom(dir) {
    if (fadeState !== 0) return;
    targetRoom = (currentRoom + dir + ROOMS.length) % ROOMS.length;
    fadeState = 1; fadeT = 0;
    synthWhoosh();
  }

  function bindNav(btn, dir) {
    function press(e) {
      e.preventDefault && e.preventDefault();
      btn.classList.add('pressed');
      switchRoom(dir);
      setTimeout(function () { btn.classList.remove('pressed'); }, 180);
    }
    btn.addEventListener('pointerdown', press, { passive: false });
    btn.addEventListener('touchstart', press, { passive: false });
  }

  function bindInput() {
    const opts = { passive: false, capture: true };
    function handle(e) {
      if (e.cancelable !== false) e.preventDefault();
      const touches = e.touches && e.touches.length ? e.touches : [e];
      for (let i = 0; i < touches.length; i++) {
        const t = touches[i];
        onDown(t.clientX !== undefined ? t.clientX : t.pageX, t.clientY !== undefined ? t.clientY : t.pageY);
      }
    }
    canvas.addEventListener('pointerdown', handle, opts);
    canvas.addEventListener('touchstart', handle, opts);
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, opts);
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, opts);
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, opts);
    document.addEventListener('gestureend', function (e) { e.preventDefault(); }, opts);
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, opts);
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, opts);
    document.addEventListener('selectstart', function (e) { e.preventDefault(); }, true);
    startOverlay.addEventListener('pointerdown', handle, opts);
    startOverlay.addEventListener('touchstart', handle, opts);
  }

  /* ---------- HUD (goal meter + room dots) ---------- */
  function drawHUD() {
    const topY = 26;
    const slot = Math.min(W / starGoal, 34);
    const totalW = slot * (starGoal + 1) + 40;
    let x0 = W / 2 - totalW / 2;

    // lamp icon at far left of meter
    ctx.font = (H * 0.06) + 'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('💡', x0 + 20, topY + 16);
    x0 += 46;

    for (let i = 0; i < starGoal; i++) {
      const filled = i < starCount;
      const cx = x0 + slot * i + slot / 2;
      const cy = topY + 16;
      // slot backing
      ctx.fillStyle = '#2a2a4a';
      ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.arc(cx, cy, slot * 0.42, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
      if (filled) {
        starShape(cx, cy, slot * 0.34, -Math.PI / 2, '#ffd94a');
      } else {
        ctx.fillStyle = '#8a8ab0';
        ctx.globalAlpha = 0.5;
        ctx.beginPath(); ctx.arc(cx, cy, slot * 0.42, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // house glow when full
    if (houseLit) {
      ctx.globalAlpha = 0.25 + 0.1 * Math.sin(time * 5);
      ctx.fillStyle = '#ffd94a';
      ctx.beginPath(); ctx.arc(W / 2, topY + 16, totalW * 0.4, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // room dots (which room you are in)
    const dotN = ROOMS.length;
    const dotW = 26;
    let dx = W / 2 - (dotN * dotW) / 2;
    const dy = H - 26;
    for (let i = 0; i < dotN; i++) {
      const active = i === currentRoom;
      ctx.fillStyle = active ? '#ffd94a' : 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(dx + dotW * i + dotW / 2, dy, 7, 0, 7); ctx.fill();
      if (active) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      }
    }
  }

  /* ---------- update ---------- */
  function update(dt) {
    time += dt;

    // room switch fade
    if (fadeState === 1) {
      fadeT += dt;
      if (fadeT >= 0.45) {
        currentRoom = targetRoom;
        buildRoom();
        fadeState = 2; fadeT = 0;
      }
    } else if (fadeState === 2) {
      fadeT += dt;
      if (fadeT >= 0.45) fadeState = 0;
    }

    // house-lit celebration then reset for endless replay
    if (houseLit) {
      litTimer += dt;
      if (litTimer > 3) {
        houseLit = false;
        starCount = 0;
      }
    }

    // spawn logic (more characters per room now)
    spawnTimer -= dt;
    if (spawnTimer <= 0 && characters.length < 3) {
      spawnTimer = 0.9 + rng() * 1.4;
      spawnCharacter();
    }

    // characters
    for (let i = 0; i < characters.length; i++) {
      const c = characters[i];
      if (!c.active) continue;
      c.t += dt;
      c.dur += dt;
      c.appear = Math.min(c.appear + dt * 8, 1);
      c.cue = Math.min(c.cue + dt, 1);
      if (c.bounce > 0) c.bounce += dt * 10;
      const lifeLimit = c.tapped ? 0.6 : c.life;
      if (c.dur >= lifeLimit) {
        c.active = false;
        c.spot.occupied = false;
        setTimeout(function () { c.dead = true; }, 250);
      }
    }

    // stars
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.life += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy += 0.06 * dt * 60;
      s.vx *= 0.98;
      if (s.life > 1.4) stars.splice(i, 1), i--;
    }
    // sparks
    for (let i = 0; i < sparks.length; i++) {
      const s = sparks[i];
      s.life += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= 0.94;
      s.vy *= 0.94;
      if (s.life > 0.6) sparks.splice(i, 1), i--;
    }
    // confetti
    for (let i = 0; i < confetti.length; i++) {
      const s = confetti[i];
      s.life += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy += 1.2 * dt;
      s.rot += dt * 8;
      if (s.life > 1.2) confetti.splice(i, 1), i--;
    }
    celebrate = Math.max(0, celebrate - dt * 2);
  }

  /* ---------- render ---------- */
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // during fade to dark, draw old room; after switch, draw new room
    drawRoom();

    // characters
    characters.forEach(function (c) {
      if (c.dead) return;
      const alpha = Math.min(1, c.appear);
      const rise = (1 - c.appear) * 30;
      ctx.save();
      ctx.globalAlpha = alpha;
      if (c.cue < 0.55) {
        const g = Math.sin(c.cue * Math.PI) * 0.45;
        ctx.globalAlpha = alpha * g;
        ctx.fillStyle = '#ffd94a';
        ctx.beginPath(); ctx.arc(c.x, c.y - 40 * c.scale, 46 * c.scale, 0, 7); ctx.fill();
        ctx.globalAlpha = alpha;
      }
      if (c.kind === 0) drawGhost(c.x, c.y - 40 * c.scale + rise, c.scale, c.t, c.bounce);
      else if (c.kind === 1) drawZombie(c.x, c.y - 40 * c.scale + rise, c.scale, c.t, c.bounce);
      else drawMonster(c.x, c.y - 40 * c.scale + rise, c.scale, c.t, c.bounce);
      ctx.restore();
    });

    // sparks
    sparks.forEach(function (s) {
      ctx.globalAlpha = Math.max(0, 1 - s.life / 0.6);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    });

    // star rewards
    stars.forEach(function (s) {
      starShape(s.x, s.y, s.scale * 6, s.life * 6, s.color);
    });

    // confetti
    confetti.forEach(function (s) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.globalAlpha = Math.max(0, 1 - s.life / 1.2);
      ctx.fillStyle = s.color;
      ctx.fillRect(-5, -3, 10, 6);
      ctx.restore();
      ctx.globalAlpha = 1;
    });

    // milestone celebration glow
    if (celebrate > 0) {
      ctx.globalAlpha = celebrate * 0.18;
      ctx.fillStyle = '#ffd94a';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    drawHUD();

    // room-switch fade overlay
    let fadeAlpha = 0;
    if (fadeState === 1) fadeAlpha = fadeT / 0.45;
    else if (fadeState === 2) fadeAlpha = 1 - fadeT / 0.45;
    if (fadeAlpha > 0) {
      ctx.globalAlpha = Math.min(1, fadeAlpha);
      ctx.fillStyle = '#0c1a2e';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  /* ---------- main loop ---------- */
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // cleanup dead chars occasionally
  setInterval(function () {
    for (let i = characters.length - 1; i >= 0; i--) {
      if (characters[i].dead) characters.splice(i, 1);
    }
  }, 600);

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  resize();
  bindInput();
  bindNav(leftBtn, -1);
  bindNav(rightBtn, 1);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
